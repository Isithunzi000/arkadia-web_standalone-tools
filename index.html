<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Arkadia Web Standalone Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <!-- PLIK GENEROWANY PRZEZ scripts/build.mjs - nie edytowac recznie -->
  <script>
    const APP_FILE = "app.702f16e1.html";
    const targetUrl = APP_FILE + window.location.search + window.location.hash;
    window.addEventListener("DOMContentLoaded", () => {
      const link = document.getElementById("app-link");
      if (link) { link.href = targetUrl; link.textContent = targetUrl; }
    });
    window.location.replace(targetUrl);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0d1117; color: #e6edf3; }
    main { max-width: 560px; padding: 32px; text-align: center; }
    a { color: #58a6ff; }
  </style>
</head>
<body>
  <main>
    <h1>Przekierowanie…</h1>
    <p>Jeżeli strona nie otworzy się automatycznie, <a id="app-link" href="app.702f16e1.html">kliknij tutaj</a>.</p>
    <noscript><p>JavaScript jest wyłączony. Otwórz ręcznie: <a href="app.702f16e1.html">app.702f16e1.html</a></p></noscript>
  </main>
</body>
</html>
