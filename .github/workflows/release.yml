name: Release PWA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wersja i data z tagu
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cs "$GITHUB_REF_NAME" 2>/dev/null || date +%F)" >> "$GITHUB_OUTPUT"

      - name: Build (deterministyczny)
        run: VERSION=${{ steps.meta.outputs.version }} RELEASED_AT=${{ steps.meta.outputs.date }} node scripts/build.mjs

      - name: Verify (brak deploya przy bledzie)
        run: node scripts/verify.mjs

      - name: Publikacja artefaktow na main (idempotentna)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js manifest.webmanifest versions.json icons/ app.*.html
          if git diff --cached --quiet; then
            echo "Brak zmian - artefakty identyczne (idempotentnie)."
          else
            git commit -m "Release ${{ github.ref_name }} [skip ci]"
            git push origin main
          fi
